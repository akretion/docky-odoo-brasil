services:
  odoo:
    environment:
      DB_HOST: host.docker.internal
      DB_NAME: $PGDATABASE
      DB_USER: $PGUSER
      DB_PASS: $PGPASSWORD
      PGHOST: host.docker.internal
      PGDATABASE: $PGDATABASE
      PGUSER: $PGUSER
      PGPASSWORD: $PGPASSWORD
      ADDONS_PATH: /odoo/links,/odoo/local-src,/odoo/src/odoo/addons,/odoo/src/addons,/odoo/external-src/account-payment,/odoo/external-src/bank-payment,/odoo/external-src/currency,/odoo/external-src/server-tools,/odoo/external-src/l10n-brazil-FIX-crm,/odoo/external-src/account-financial-reporting,/odoo/external-src/server-ux,/odoo/external-src/reporting-engine,/odoo/external-src/account-invoicing-mig-stock_pck_inv_24_08_2023,/odoo/external-src/stock-logistics-workflow,/odoo/external-src/mis-builder,/odoo/external-src/contract,/odoo/external-src/account-reconcile,/odoo/external-src/purchase-workflow,/odoo/external-src/sale-workflow,/odoo/external-src/delivery-carrier

      ADDITIONAL_ODOO_RC: |-
        encryption_key_dev=$ENCRYPTION_KEY_DEV
        encryption_key_prod=$ENCRYPTION_KEY_PROD
        encryption_key_preprod=$ENCRYPTION_KEY_PREPROD
      KWKHTMLTOPDF_SERVER_URL: http://kwkhtmltopdf:8080
      LOCAL_USER_ID: $UID
      # TODO property of the host ?
      # WORKER
      # LIMIT_MEMORY_SOFT
      # LIMIT_MEMORY_HARD
      # MAX_CRON_THREAD
      # DB_MAXCON
      LIMIT_TIME_CPU: 4000
      LIMIT_TIME_REAL: 4800
      LIMIT_TIME_REAL_CRON: 4800
      MARABUNTA_MODE: ${MARABUNTA_MODE:-prod}
      ODOO_REPORT_URL: http://odoo:8069
      #,queue_job,sentry?
      ODOO_QUEUE_JOB_CHANNELS:
          root:4,
          root.pattern.import:1,
          root.pattern.export:4,
          root.shopinvader.bind_products:4,
          root.search_engine.recompute:4,
          root.search_engine.synchronize:4
      # ENCRYPTION_KEY_DEV=
      # SENTRY_DSN=
      RUNNING_ENV: $ENV
      UNACCENT: "True"
    hostname: ${ENV}-${COMPOSE_PROJECT_NAME}
    labels:
      docky.main.service: true
      docky.user: odoo
